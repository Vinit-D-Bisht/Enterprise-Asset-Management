services:
  e2e-db:
    image: postgres:16-alpine
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: eamms_e2e
      POSTGRES_USER: eamms_e2e
      POSTGRES_PASSWORD: ${EAMMS_E2E_DB_PASSWORD:?provide a disposable E2E database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eamms_e2e -d eamms_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

  e2e-api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://eamms_e2e:${EAMMS_E2E_DB_PASSWORD:?provide a disposable E2E database password}@e2e-db:5432/eamms_e2e
      JWT_SECRET_KEY: ${EAMMS_E2E_JWT_SECRET:?provide a disposable E2E JWT secret}
      APP_ENV: development
      COMPANY_CURRENCY: INR
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:3001
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      e2e-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  e2e-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      e2e-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
