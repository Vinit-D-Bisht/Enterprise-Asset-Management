name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m ruff check app tests alembic
        working-directory: backend
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-placeholder.db
          JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
          JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure disposable E2E secrets
        run: |
          echo "EAMMS_E2E_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "EAMMS_E2E_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EAMMS_E2E_API_URL=http://127.0.0.1:8001" >> "$GITHUB_ENV"
          echo "EAMMS_E2E_WEB_URL=http://127.0.0.1:3001" >> "$GITHUB_ENV"
      - name: Start isolated PostgreSQL E2E stack
        run: docker compose -f docker-compose.e2e.yml -p eamms-release-e2e up --build --detach --wait
      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run browser workflows
        working-directory: frontend
        run: npm run e2e -- --grep-invert "empty first-run setup"
      - name: Recreate isolated database for empty setup workflow
        run: |
          docker compose -f docker-compose.e2e.yml -p eamms-release-e2e down --remove-orphans
          docker compose -f docker-compose.e2e.yml -p eamms-release-e2e up --build --detach --wait
      - name: Verify empty setup and immediate sign-in
        working-directory: frontend
        run: npm run e2e -- --grep "empty first-run setup"
      - name: Remove disposable E2E containers
        if: always()
        run: docker compose -f docker-compose.e2e.yml -p eamms-release-e2e down --remove-orphans
